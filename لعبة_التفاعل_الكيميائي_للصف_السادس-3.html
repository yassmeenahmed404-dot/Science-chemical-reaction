<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة التفاعل الكيميائي - الصف السادس</title>
<style>
body{font-family:Arial,sans-serif;background:#eef7ff;margin:0;padding:20px;color:#17324d}
.container{max-width:720px;margin:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 5px 20px #0002}
h1{text-align:center;color:#1261a0}
.card{background:#f7fbff;border-radius:15px;padding:18px;margin:15px 0}
button{border:0;border-radius:12px;padding:12px 18px;margin:6px;font-size:17px;cursor:pointer;background:#1261a0;color:white}
button:hover{opacity:.9}
.option{display:block;width:100%;background:#e5f1fb;color:#17324d;text-align:right}
.correct{background:#b9efc5!important}.wrong{background:#ffc4c4!important}
#score{font-size:20px;font-weight:bold;text-align:center}
#feedback{text-align:center;font-size:20px;font-weight:bold;min-height:30px}
#next{display:none;background:#2b8a3e}
.small{text-align:center;color:#667}
</style>
</head>
<body>
<div class="container">
<h1>🧪 لعبة التفاعل الكيميائي</h1>
<p class="small">للصف السادس الابتدائي</p>
<div id="score">النتيجة: 0 من 5</div>
<div class="card">
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button id="next" onclick="nextQuestion()">السؤال التالي ➜</button>
</div>
</div>

<script>
const questions=[
{q:"ما الذي يحدث غالبًا في التفاعل الكيميائي؟",a:["تتكون مواد جديدة","يتغير شكل المادة فقط","تختفي المادة تمامًا","لا يحدث أي تغير"],c:0},
{q:"أي علامة قد تدل على حدوث تفاعل كيميائي؟",a:["تكوّن غاز أو فقاعات","تغيير مكان الجسم","قص الورق","ذوبان الثلج فقط"],c:0},
{q:"عند صدأ الحديد تتكون مادة جديدة تسمى:",a:["الصدأ","الماء","الملح","السكر"],c:0},
{q:"أي مما يلي مثال على تغير كيميائي؟",a:["احتراق الخشب","تكسير الزجاج","ذوبان الثلج","قطع الورق"],c:0},
{q:"في التفاعل الكيميائي تتحول المواد المتفاعلة إلى:",a:["مواد جديدة تسمى نواتج","نفس المواد دون تغيير","ضوء فقط","ماء دائمًا"],c:0}
];

let current=0,score=0,answered=false;
function showQuestion(){
 answered=false;
 document.getElementById("question").textContent=(current+1)+"️⃣ "+questions[current].q;
 const box=document.getElementById("options"); box.innerHTML="";
 questions[current].a.forEach((x,i)=>{
   const b=document.createElement("button");
   b.className="option"; b.textContent=x;
   b.onclick=()=>answer(i,b);
   box.appendChild(b);
 });
 document.getElementById("feedback").textContent="";
 document.getElementById("next").style.display="none";
 document.getElementById("score").textContent=`النتيجة: ${score} من ${questions.length}`;
}
function answer(i,btn){
 if(answered)return; answered=true;
 const q=questions[current];
 if(i===q.c){score++;btn.classList.add("correct");document.getElementById("feedback").textContent="🎉 إجابة صحيحة!";}
 else{btn.classList.add("wrong");document.getElementById("feedback").textContent="💡 ليست صحيحة. الإجابة الصحيحة: "+q.a[q.c];}
 document.querySelectorAll(".option")[q.c].classList.add("correct");
 document.getElementById("score").textContent=`النتيجة: ${score} من ${questions.length}`;
 document.getElementById("next").style.display="inline-block";
}
function nextQuestion(){
 current++;
 if(current<questions.length) showQuestion();
 else{
   document.querySelector(".card").innerHTML=`<h2 style="text-align:center">🏆 انتهت اللعبة!</h2>
   <p style="text-align:center;font-size:24px">حصلتِ على <b>${score}</b> من <b>${questions.length}</b></p>
   <p style="text-align:center">${score===5?"ممتاز! 🌟":score>=3?"أحسنتِ! 👏":"حاولي مرة أخرى 💪"}</p>
   <div style="text-align:center"><button onclick="location.reload()">🔄 إعادة اللعبة</button></div>`;
 }
}
showQuestion();
</script>
</body>
</html>
